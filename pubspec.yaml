name: flutter_marketplace
description: E-Commerce Marketplace - Final Project
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^17.2.3

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Networking
  chopper: ^8.0.0
  http: ^1.2.1

  # Local DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0

  # Shared Preferences
  shared_preferences: ^2.2.3

  # Firebase / Firestore
  firebase_core: ^4.9.0
  cloud_firestore: ^6.4.1
  firebase_auth: ^6.5.1

  # JSON serialization
  json_annotation: ^4.9.0

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^4.0.3
  json_serializable: ^6.8.0
  chopper_generator: ^8.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
